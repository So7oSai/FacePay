<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FacePay - Home</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Welcome to FacePay</h1>
        <p>Your seamless UPI payment solution using face recognition.</p>
        
        <form method="POST" action="{{ url_for('index') }}">
            <label for="amount">Enter Amount (INR):</label>
            <input type="number" name="amount" id="amount" required min="1" step="0.01" placeholder="e.g., 10.00">
            <button type="submit">Proceed to Scan</button>
        </form>
        <div class="nav-links">
            <a href="{{ url_for('register_route') }}" class="nav-button">Register New Face</a>
        </div>
    </div>
</body>
</html>
